version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    container_name: decomu_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - decomu_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decomu_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage/proofs:/app/storage/proofs
      - ./migrations:/app/migrations:ro
      - sqlite_data:/app/data
    networks:
      - decomu_net

volumes:
  caddy_data:
  caddy_config:
  sqlite_data:

networks:
  decomu_net:
    driver: bridge
